id = "extra-skill-slots"
name = "Extra skill slots"
version = "1.0.11"
author = "underkeep-qol"
description = "More active-skill slots per hero. Assign skills to them in this menu; each slot's key casts it for the selected hero, with the game's own checks, costs and cooldowns."
# Builds (exe SHA-256) the mod was tested on: 1.0.5 (Steam).
game_builds = ["d3158ad0f94d6770deb64b32d48aeb412a3c5ef3a0b2e37a0e092a7ce66bb4a4"]
enabled = true

[[settings]]
key = "slots"
type = "int"
default = 3
min = 1
max = 5
label = "Extra slots"
description = "How many extra skill slots each hero has."

[[settings]]
key = "hud_buttons"
type = "bool"
default = true
label = "Buttons on the HUD"
description = "Shows each hero's extra slots next to their skill slot: left-click casts, right-click assigns, hover shows the game's skill tooltip. A slot turns red while its skill is on cooldown."

[[settings]]
key = "slot_1_key"
type = "key"
default = ""
label = "Slot 1 key"
description = "Casts the selected hero's extra slot 1."

[[settings]]
key = "slot_2_key"
type = "key"
default = ""
label = "Slot 2 key"
description = "Casts the selected hero's extra slot 2."

[[settings]]
key = "slot_3_key"
type = "key"
default = ""
label = "Slot 3 key"
description = "Casts the selected hero's extra slot 3."

[[settings]]
key = "slot_4_key"
type = "key"
default = ""
label = "Slot 4 key"
description = "Casts the selected hero's extra slot 4."

[[settings]]
key = "slot_5_key"
type = "key"
default = ""
label = "Slot 5 key"
description = "Casts the selected hero's extra slot 5."
