# Patterns for hidden-stats. Format: CONTRIBUTING.md, "Adding a mod".
# Addresses in comments: 1.0.5 / 1.0.6 (Steam) VAs. Each pattern matches once
# on both builds, and each function is the same code on the two.

# The stats page's row list rebuild, 0x140236f20 / see report:
# (StatsPage* page, Hero* hero). Called every frame by the stats page's draw
# (0x14023b290) before it lays out and draws the rows. Empties the row
# vector (count page+0x28, capacity +0x2c, data +0x30; rows of 0x140 bytes)
# and appends the sections: Active Effects, Hero, Offense, Defense. A row:
# +0x00 kind (0 stat, 1 section header, 2 status effect), +0x08 its text
# key (a game String; the label is the key's text with %1 = the value, the
# description panel shows the text of key + "_desc"), +0x20 the value
# (String). Found from the "stats_section_hero" key's only use. Prologue
# through `lea rdi, [rcx+0x28]`.
[stats_rebuild]
pattern = "48 89 5C 24 18 48 89 54 24 10 55 56 57 41 54 41 55 41 56 41 57 48 8D AC 24 F0 CF FF FF B8 10 31 00 00 E8 ?? ?? ?? ?? 48 2B E0 4C 8B F2 45 33 ED 44 89 AD 50 30 00 00 48 8D 79 28"

# Push_back for vectors of 0x140-byte rows, 0x14027a860: (Vec* v, Row* row)
# with v = {count, capacity, data}; grows the vector when full (0x140286f70)
# and moves the row in (its two Strings are taken, the source's emptied).
# What stats_rebuild appends each row with.
[row_push]
pattern = "48 89 5C 24 08 57 48 83 EC 20 8B 01 48 8B FA 48 8B D9 3B 41 04 7C 07 E8 ?? ?? ?? ?? 8B 03 48 98 48 8D 0D ?? ?? ?? ?? 45 33 C0 48 8D 14 80 8B 07 48 C1 E2 06 48 03 53 08"

# String_Concat(String* out, const String* a, const String* b) -> out,
# 0x140027de0 (as in learned-recipes): a new, counted String; the mod makes
# each value text with it from a literal and an empty string.
[string_concat]
pattern = "4C 89 44 24 18 41 54 41 55 41 56 41 57 48 83 EC 28 4C 63 62 10 4C 8B EA"

# Text_Exists(const String* key) -> bool, 0x1400ecac0: whether the current
# language's text tables have the key. The stats page uses it for "_desc".
# The mod checks its own first key with it: when the mod was turned on after
# the game started, its texts (data patches) aren't loaded yet, and it adds
# no rows rather than show raw keys. Optional: without it the rows are
# always added.
[text_exists]
pattern = "48 89 5C 24 08 48 89 74 24 10 48 89 7C 24 18 4C 89 64 24 20 55 41 56 41 57 48 8D 6C 24 B9 48 81 EC 90 00 00 00 4C 63 35 ?? ?? ?? ?? 4C 8D 25 ?? ?? ?? ?? 48 8B F9 41 83 FE 06 77"
optional = true
