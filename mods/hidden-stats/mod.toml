id = "hidden-stats"
name = "Hidden stats"
version = "1.0.18"
author = "underkeep-qol"
description = "Adds the stats the game keeps hidden to each hero's stats page: hit chances, flat and percent damage bonuses, armor ignored, armor against melee, ranged and animal attacks, ranged evasion and the evasion cap, void resistance, element and spell bonuses, the spell mana cost change, burn and freeze chances, healing bonuses, the experience bonus and immunities. Select a row to read what it does."
# Build (exe SHA-256) the mod is made for: 1.0.6 (Steam), the current game.
game_builds = ["556f696519db3a948f1ef1f37e4fdc23293c330d00d93399380dd2c3606055ba"]
enabled = true

[[settings]]
key = "show_zero"
type = "bool"
default = false
label = "Show stats that are 0"
description = "Also show the rare stats (element and spell bonuses, burn and freeze chances, healing bonuses, immunities, ...) while the hero has none of them. Off: only the ones the hero has, plus the hit chances, damage, armor and evasion rows."
