id = "learned-recipes"
name = "Learned recipes"
version = "1.0.15"
author = "underkeep-qol"
description = "Shows which recipes the party has already learned: a check mark on the recipe's icon in the inventory and in shops, and a Learned / Not learned yet line in its tooltip. A recipe counts as learned once it's in the mortar's recipe list, which happens when you craft it."
# Build (exe SHA-256) the mod is made for: 1.0.6 (Steam), the current game.
game_builds = ["556f696519db3a948f1ef1f37e4fdc23293c330d00d93399380dd2c3606055ba"]

[[settings]]
key = "icon_mark"
type = "bool"
default = true
label = "Check mark on learned recipes"
description = "A small green check mark in the corner of a learned recipe's icon, in the inventory and in shops (both your list and the merchant's)."

[[settings]]
key = "tooltip"
type = "bool"
default = true
label = "Learned line in the tooltip"
description = "A line at the bottom of every recipe's tooltip: Learned, or Not learned yet. The text follows the game's language."
