id = "item-cooldowns"
name = "Item cooldowns"
version = "1.0.18"
author = "underkeep-qol"
description = "Shows how much of an item's ability cooldown is left, in the item's tooltip, so you can check it without equipping the item. The game keeps counting the cooldown down while the item is in your inventory."
# Build (exe SHA-256) the mod is made for: 1.0.6 (Steam), the current game.
game_builds = ["556f696519db3a948f1ef1f37e4fdc23293c330d00d93399380dd2c3606055ba"]

[[settings]]
key = "show_ready"
type = "bool"
default = true
label = "Show Ready"
description = "When the ability is ready, the line says Ready. Turn it off to show the line only while the ability is on cooldown."
