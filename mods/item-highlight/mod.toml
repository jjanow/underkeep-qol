id = "item-highlight"
name = "Item highlight"
version = "1.0.19"
author = "underkeep-qol"
description = "Makes items on the ground, containers with something in them, switches, objects you can still use and things you can break glow in the dungeon view, so nothing is missed."
# Build (exe SHA-256) the mod is made for: 1.0.6 (Steam), the current game.
game_builds = ["556f696519db3a948f1ef1f37e4fdc23293c330d00d93399380dd2c3606055ba"]
enabled = true

[[settings]]
key = "shown"
type = "bool"
default = true
label = "Highlight on"
description = "Whether the highlight is shown. The toggle key flips this, and the choice is kept for the next game."

[[settings]]
key = "toggle_key"
type = "key"
default = "H"
label = "Toggle key"
description = "Turns the highlight on or off."

[[settings]]
key = "toggle_pad"
type = "key"
default = ""
label = "Toggle button (gamepad)"
description = "Turns the highlight on or off. Unbound by default: every pad button already has a game action."


[[settings]]
key = "strength"
type = "float"
default = 0.85
min = 0.0
max = 1.0
label = "Strength"
description = "How strongly highlighted things take the color: 0 only tints them, 1 colors them fully."

[[settings]]
key = "items"
type = "bool"
default = true
label = "Items"
description = "Items lying on the ground or in alcoves."

[[settings]]
key = "containers"
type = "bool"
default = true
label = "Containers"
description = "Chests that haven't been opened, and alcoves and shelves with something in them."

[[settings]]
key = "switches"
type = "bool"
default = true
label = "Switches"
description = "Wall buttons, levers and keyholes."

[[settings]]
key = "objects"
type = "bool"
default = true
label = "Usable objects"
description = "Scenery you can click and haven't used up yet: tree holes and hiding places, plants to pick, apple trees with apples left, signs and paintings, wells, statues, graves to dig, rocks that start an event. Once an object is used up (the game lowers it or changes its picture, like a dug grave), the glow goes."

[[settings]]
key = "breakables"
type = "bool"
default = true
label = "Breakable objects"
description = "Barrels, crates, urns, webs and furniture you can smash, until they're broken."

[[settings]]
key = "lights"
type = "bool"
default = false
label = "Torches, braziers and campfires"
description = "Torches, braziers and campfires you can light or put out, flames included. Off by default: there are many and they never run out, but some puzzles use braziers."

[[settings]]
key = "color"
type = "color"
default = "#33FF33"
label = "Item color"
description = "Color of items on the ground or in alcoves. With the game's \"Show items behind objects\" option on, their see-through copies take it too."

[[settings]]
key = "color_containers"
type = "color"
default = "#FFC020"
label = "Container color"

[[settings]]
key = "color_switches"
type = "color"
default = "#33CCFF"
label = "Switch color"

[[settings]]
key = "color_objects"
type = "color"
default = "#C070FF"
label = "Usable object color"

[[settings]]
key = "color_breakables"
type = "color"
default = "#FF5050"
label = "Breakable object color"

[[settings]]
key = "color_lights"
type = "color"
default = "#FFFF80"
label = "Torch, brazier and campfire color"

[[settings]]
key = "debug"
type = "bool"
default = false
label = "Log what's drawn"
description = "Write each kind of thing in the dungeon view to uk_qol.log once (class and definition name), for bug reports."
