# Patterns for weapon-swap. Format: CONTRIBUTING.md, "Adding a mod".
# Names in the comments (Hero::EquipItem, ...) come from the exe's own assert
# strings where it has them, otherwise they describe what the code does.

# --- Functions -------------------------------------------------------------

# Hero::EquipItem(hero, item, slot, mode, notify): the equip path used by the
# inventory, the character sheet and the HUD hand slot. Checks the slot and
# class, takes the item out of the inventory, moves the old item (and the
# shield, for a two-handed weapon) back to it, recalculates the stats and
# runs the item's on_equip script. Found from the "on_equip" string.
[hero_equip_item]
pattern = "48 85 D2 0F 84 ?? ?? ?? ?? 48 8B C4 48 89 58 08 48 89 70 18 48 89 78 20 55 41 54 41 55 41 56 41 57 48 8D 68 A9 48 81 EC"

# Hero::Unequip(hero, slot, mode, recalc): moves a slot's item to the party
# inventory and runs on_unequip. Found from the "on_unequip" string.
[hero_unequip]
pattern = "48 89 5C 24 18 55 56 57 41 54 41 55 41 56 41 57 48 8B EC 48 83 EC 70 0F 29 74 24 60 0F 29 7C 24 50 45 0F B6 E1 45 8B F0"

# Item_Create(const String* def_name) -> Item*: builds an item from its def,
# as Item::RestoreState does when a save is loaded (it then sets the count
# and cooldown). Found as the call in Item::RestoreState ("def_name").
[item_create]
pattern = "48 89 5C 24 08 48 89 74 24 10 57 48 83 EC 30 48 8B 1D ?? ?? ?? ?? 48 8B F1 48 8B C3 48 B9 2D 7F 95 4C 2D F4 51 58 48 0F AF C1 48 8B FB BA 03 00 00 00"

# Item_Take(item, all, n): takes n from a stack, or with `all` the whole
# item: removes it from the hero wearing it or from the party inventory,
# marks the inventory changed and queues the item object for deletion. Used
# by the game when an item is used up (Blood Mage bones, potions).
[item_take]
pattern = "48 89 5C 24 10 48 89 74 24 18 57 48 83 EC 20 44 29 81 D0 00 00 00 48 8B F1"

# Inventory::Add(inventory, item, newly_picked) -> Item*: appends the item
# (or merges a stackable one) and marks the inventory changed. Called by
# Hero::Unequip.
[inventory_add]
pattern = "40 55 57 48 83 EC 38 48 89 5C 24 50 33 FF 48 8B EA 48 89 74 24 58 48 8B D9 4C 89 64 24 60 4C 89 6C 24 30 45 0F B6 E8"

# Whether a fight is on: any living monster that is awake and aware of the
# party. The game uses it to start the "battle started" tutorial.
[in_battle]
pattern = "4C 8B 1D ?? ?? ?? ?? 33 D2 45 8B 8B 40 01 00 00 45 85 C9 0F 8E ?? ?? ?? ?? 4D 8B 93 48 01 00 00 48 63 C2 4D 8B 04 C2 41 83 B8 20 78 00 00 00 74"

# TurnManager: appends a round action of the given type and returns it
# (0xe8 bytes; +8 = hero index for the hero actions). Type 3 ends one
# hero's turn (marks them as having acted, then picks the next hero).
# Found from TurnManager::_DoRoundAction's queue.
[round_action_push]
pattern = "40 55 56 57 41 54 41 55 41 56 41 57 48 83 EC 30 FF 81 04 01 00 00 48 8B F9"

# The item on the mouse cursor (-> Item*, null if none): the game's drop
# targets call it. Reads the UI context through the `cursor` global (the
# mod points that at `ui_context` for the call): drag phase above 1
# (exactly 2 for click-to-carry drags), then by what is carried (+0x60): 0 a hero's
# equipment slot (+0x80 hero, +0x7c slot), 1 and 2 a UI object by id (+0x7c)
# holding the item (party inventory, floor). Items are picked up with a
# click and dropped with the next one; the item stays where it was until a
# drop target equips or moves it.
[drag_item]
pattern = "40 57 48 83 EC 20 48 8B 05 ?? ?? ?? ?? 33 FF 8B 48 58 83 F9 01 0F 8E"

# Ends the drag (clears the context's +0x58..+0xbf; through `cursor` like
# drag_item): what every drop target calls after handling a drop, and what
# cancels one. Nothing is moved.
[drag_end]
pattern = "48 89 5C 24 08 55 48 8D 6C 24 A9 48 81 EC 90 00 00 00 48 8B 1D ?? ?? ?? ?? 83 7B 58 00 0F 84"

# script_condition(id, ?, ctx) -> bool: evaluates one condition of an
# encounter script (`[state x and party_has_item y]`). Condition 0x10 is
# party_has_item, 0x11 party_has_all_items: both count the named def over
# the party inventory and every hero's equipment. ctx+0x30 is the argument
# list. Found from the opcode-name table built at 0x1400e5d90 (1.0.5).
[script_condition]
pattern = "48 89 5C 24 20 55 56 57 41 54 41 55 41 56 41 57 48 8D 6C 24 D0 48 81 EC 30 01 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 45 20 4D 8B F8 4C 89 45"

# script_command(id, ctx): runs one encounter-script command. Command 0x18
# is remove_party_item (inventory first, then the heroes' equipment; 0x17
# is give_party_item). Same opcode table as script_condition. 1.0.6 added a
# command (switch bound 0xa5 -> 0xa6) and shrank the frame by 0x10; the ids
# above didn't change and the function is still at 0x1400dbc20.
[script_command]
[[script_command.candidates]]
pattern = "48 89 5C 24 18 55 56 57 41 54 41 55 41 56 41 57 48 8D AC 24 A0 DD FF FF B8 60 23 00 00 E8 ?? ?? ?? ?? 48 2B E0 0F 29 B4 24 50 23 00 00"
builds = ["d3158ad0f94d6770deb64b32d48aeb412a3c5ef3a0b2e37a0e092a7ce66bb4a4"]
[[script_command.candidates]]
pattern = "48 89 5C 24 18 55 56 57 41 54 41 55 41 56 41 57 48 8D AC 24 B0 DD FF FF B8 50 23 00 00 E8 ?? ?? ?? ?? 48 2B E0 0F 29 B4 24 40 23 00 00"
builds = ["556f696519db3a948f1ef1f37e4fdc23293c330d00d93399380dd2c3606055ba"]

# --- Item cooldowns (`cooldown`; optional: without them a weapon in slot II
# keeps its cooldown until it is back in the game) -------------------------

# Party round tick, 0x140187da0 (1.0.6): (party). Once per game turn: counts
# down the party's timers, every party-inventory item's cooldown (Item+0xe8)
# by one, then each hero's skill and equipment cooldowns (0x140180370).
# Found as the code that decrements Item+0xe8 over the inventory.
[party_round_tick]
pattern = "48 89 5C 24 08 48 89 74 24 10 48 89 7C 24 18 4C 89 74 24 20 55 48 8D 6C 24 A9 48 81 EC E0 00 00 00 8B 81 00 0B 00 00 48 8B F1"
optional = true

# A hero's rest step, 0x14017dbb0 (1.0.6): (hero). The rest update
# (0x140187040, every frame while resting) counts every party-inventory
# item's cooldown down by one for each rest step and then calls this for the
# four heroes in order; its only caller.
[hero_rest_step]
pattern = "48 89 5C 24 20 55 41 54 41 55 41 56 41 57 48 8D 6C 24 C9 48 81 EC B0 00 00 00 45 33 ED 48 8B D9 45 8B E5 45 8B F5 45 8B FD 44 38 29"
optional = true

# --- Data ------------------------------------------------------------------

# The TurnManager (+0 = phase, 1 while monsters act; +8 = queued actions).
# Hero::EquipItem's tail: `mov edx, 0xf; lea rcx, [TurnManager]; call push`.
[turn_manager]
pattern = "BA 0F 00 00 00 48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 4C 8D 9C 24 A0 00 00 00"
offset = 5
rip = { disp = 3, len = 7 }

# The party (heroes at +0x10, 0x2b8 bytes each). The lea before
# Party::SaveState in Game_SaveGameState.
[party]
pattern = "48 8D 55 70 48 8B CF E8 ?? ?? ?? ?? 48 8B D0 48 8D 0D ?? ?? ?? ?? E8"
offset = 15
rip = { disp = 3, len = 7 }

# The party inventory (+8 count, +0x10 entries of 0x18 bytes, item first).
# Hero::EquipItem: `mov rdx, rbx; lea rcx, [inventory]; call Inventory::Remove`.
[party_inventory]
pattern = "48 8B D3 48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 44 8B F7 45 85 FF"
offset = 3
rip = { disp = 3, len = 7 }

# The selected hero's index. Hero::Unequip: `cmp [selected_hero], eax`
# after the character-sheet check.
[selected_hero]
pattern = "83 3D ?? ?? ?? ?? 06 0F 85 ?? ?? ?? ?? 8B 47 04 39 05 ?? ?? ?? ?? 0F 85"
offset = 16
rip = { disp = 2, len = 6 }

# The game state (3 = playing). MainMenuEnter: `mov [g_state], 5`.
[game_state]
pattern = "48 83 EC 78 0F 57 C0 C7 05 ?? ?? ?? ?? 05 00 00 00 B1 01"
offset = 7
rip = { disp = 2, len = 10 }

# The UI mode (6 = character sheet open) and the current-UI-context
# pointer (`cursor`: the game's immediate-mode UI state, set by the UI
# pass's begin and nulled by its end, so null when the mod's queue runs;
# the functions above read it, and the mod points it at `ui_context` for
# each call, then puts it back). Hero::EquipItem: `cmp [ui_mode], 6; jne;
# mov rax, [cursor]`.
[ui_mode]
pattern = "0F 87 ?? ?? ?? ?? 83 3D ?? ?? ?? ?? 06 0F 85 ?? ?? ?? ?? 48 8B 05 ?? ?? ?? ?? F3 0F 10 18 F3 0F 10 60 04"
offset = 6
rip = { disp = 2, len = 7 }

[cursor]
pattern = "0F 87 ?? ?? ?? ?? 83 3D ?? ?? ?? ?? 06 0F 85 ?? ?? ?? ?? 48 8B 05 ?? ?? ?? ?? F3 0F 10 18 F3 0F 10 60 04"
offset = 19
rip = { disp = 3, len = 7 }

# The UI context itself (+0/+4 mouse in GUI space, +0x58 drag phase), as
# passed to the UI pass's begin: `mov rcx, [context]; mulss ..;
# mov [rbp+0x518], rax`.
[ui_context]
pattern = "48 8B 0D ?? ?? ?? ?? F3 0F 59 05 ?? ?? ?? ?? 48 89 85 18 05 00 00"
rip = { disp = 3, len = 7 }

# Target selection (nonzero while the game waits for a target, e.g. after
# choosing a spell). Hero::UseSelectedSkill: `mov [target_mode], 1`.
[target_mode]
pattern = "0F 94 45 E7 48 89 45 DF E8 ?? ?? ?? ?? 48 8D 55 B7 C7 05 ?? ?? ?? ?? 01 00 00 00"
offset = 17
rip = { disp = 2, len = 10 }

# The character sheet (drawn while the UI mode is 6, for the selected hero):
# equipment slot k's rect {x, y, w, h} (f32, GUI space) at +0x14 + k * 0x28,
# rewritten every frame from the sheet's position (`barbie_position`); slot
# k's hover and press flags at +0x24..+0x26 and the "fits" highlight at
# +0x27. The HUD's `lea rcx, [sheet]; call CharSheet_Draw`
# after the inventory panel.
[char_sheet]
pattern = "E8 ?? ?? ?? ?? 48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 32 DB E8"
offset = 5
rip = { disp = 3, len = 7 }

# --- The game's item tooltip for slot II (`tooltip`; all optional: without
# them slot II shows the mod's own tooltip) ---------------------------------

# The tooltip pass, 0x140166850 (1.0.5): (float dt). Near the end of the
# frame: after the hover delay draws the armed tooltip text (and the compare
# text next to it), then disarms it; a frame where nothing armed it hides it.
# Found as the reader of the tooltip state written by tooltip_show.
[tooltip_draw]
pattern = "48 89 5C 24 18 48 89 74 24 20 55 48 8D AC 24 70 FD FF FF 48 81 EC 90 03 00 00 8B 0D ?? ?? ?? ?? 32 DB 0F 28 D8 0F 57 D2 83 E9 01 74"
optional = true

# Arms the tooltip for this frame, 0x140167270: (const String* text,
# const float pos[2], bool delay). Clears the compare text. The inventory
# panel (0x1401fc2c0) calls it for the hovered inventory or equipment item.
[tooltip_show]
pattern = "48 89 5C 24 08 57 48 83 EC 20 F3 0F 10 02 48 8B D9 48 8B 0D ?? ?? ?? ?? 41 0F B6 F8 F3 0F 11 05"
optional = true

# The compare text (String), 0x140371750: drawn next to the tooltip when
# set; the inventory panel assigns the equipped item's text there after
# tooltip_show. `mov rcx, [compare]` in tooltip_show.
[tooltip_compare]
pattern = "48 89 5C 24 08 57 48 83 EC 20 F3 0F 10 02 48 8B D9 48 8B 0D ?? ?? ?? ?? 41 0F B6 F8 F3 0F 11 05"
offset = 17
rip = { disp = 3, len = 7 }
optional = true

# Item tooltip text, 0x140248ed0: (String* out, Item* item, Item* compare,
# int hero, bool, bool) -> out. Same pattern as learned-recipes' item_tooltip.
[item_tooltip]
pattern = "40 55 53 56 57 41 54 41 55 41 56 41 57 48 8D AC 24 98 F4 FF FF 48 81 EC 68 0C 00 00"
optional = true

# A point of the GUI layout by name, 0x14011e950: (float out[2], const
# String* name) -> out. The inventory panel reads
# "inventory_item_tooltip_position" with it for the sheet's item tooltips.
[tooltip_layout_point]
pattern = "48 89 5C 24 10 48 89 6C 24 18 56 41 56 41 57 48 83 EC 60 4C 8B F2 C7 44 24 30 03 00 00 00 48 8B D9 48 8D 05"
optional = true

# String_Concat(String* out, const String* a, const String* b) -> out,
# 0x140027de0 (as in learned-recipes).
[string_concat]
pattern = "4C 89 44 24 18 41 54 41 55 41 56 41 57 48 83 EC 28 4C 63 62 10 4C 8B EA"
optional = true

# String_Copy(String* dst, const String* src) -> dst, 0x140027970: dst
# shares src's buffer (one more reference) and src is left as it is; what
# the inventory panel sets the compare text with. (0x140027a00, the
# learned-recipes "String_Assign", moves instead: it empties src.)
[string_copy]
pattern = "48 89 5C 24 08 57 48 83 EC 20 48 8B FA 48 8B D9 48 3B CA 74 60 48 8B 09"
optional = true

# String_Free(String*), 0x140003000 (as in learned-recipes).
[string_free]
pattern = "40 53 48 83 EC 20 48 8B D9 48 8B 09 48 85 C9 74 1B B8 FF FF FF FF F0 0F C1 01 83 F8 01 75 0D 48 8B 0B 48 85 C9 74 05 E8 ?? ?? ?? ?? 33 C9 48 8D 05 ?? ?? ?? ?? 48 89 0B 48 89 43 08 89 4B 10 48 83 C4 20 5B C3 CC CC CC CC CC CC CC CC CC CC CC 48 83 EC 38"
optional = true
