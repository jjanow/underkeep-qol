id = "weapon-swap"
name = "Weapon swap"
version = "1.0.2"
author = "underkeep-qol"
description = "A second weapon slot per hero and a key that swaps it with the weapon in hand (any two weapons: sword and bow, sword and shield and a two-hander)."
# Builds (exe SHA-256) the mod was tested on: 1.0.5 (Steam).
game_builds = ["d3158ad0f94d6770deb64b32d48aeb412a3c5ef3a0b2e37a0e092a7ce66bb4a4"]
enabled = true

[[settings]]
key = "swap_hero_1"
type = "key"
default = "Shift+1"
label = "Swap hero 1"
description = "Swaps hero 1's weapon in hand with the one in their second weapon slot."

[[settings]]
key = "swap_hero_2"
type = "key"
default = "Shift+2"
label = "Swap hero 2"

[[settings]]
key = "swap_hero_3"
type = "key"
default = "Shift+3"
label = "Swap hero 3"

[[settings]]
key = "swap_hero_4"
type = "key"
default = "Shift+4"
label = "Swap hero 4"

[[settings]]
key = "swap_selected"
type = "key"
default = ""
label = "Swap selected hero"
description = "Swaps the weapons of the hero selected in the game."

[[settings]]
key = "swap_costs_turn"
type = "bool"
default = true
label = "In combat, a swap costs the hero's turn"
description = "Outside combat a swap is always free."

[[settings]]
key = "hud_button"
type = "bool"
default = true
label = "Swap button on the HUD"
description = "Shows a small button with the stored weapon's initials on the weapon hand slot of each hero with a filled second weapon slot; click it to swap."

[[settings]]
key = "sheet_slot"
type = "bool"
default = true
label = "Second weapon slot on the character sheet"
description = "Shows the second weapon slot (a sword icon marked II) on the character sheet, left of the helmet slot: click it with a weapon on the cursor to put the weapon in; click it to pick its weapon up, then click the inventory or the weapon slot. Right-click moves it to the inventory."
