id = "inventory-sort"
name = "Inventory sort"
version = "1.0.16"
author = "underkeep-qol"
description = "Sorts the party inventory with one key press or the Sort button on the inventory panel."
# Build (exe SHA-256) the mod is made for: 1.0.6 (Steam), the current game.
game_builds = ["556f696519db3a948f1ef1f37e4fdc23293c330d00d93399380dd2c3606055ba"]
enabled = true

[[settings]]
key = "sort_key"
type = "key"
default = "Z"
label = "Sort key"
description = "Sorts the party inventory (not S: the game uses S for moving backward)."

[[settings]]
key = "sort_pad"
type = "key"
default = ""
label = "Sort button (gamepad)"
description = "Sorts the party inventory. Unbound by default: every pad button already has a game action."

[[settings]]
key = "merge_stacks"
type = "bool"
default = true
label = "Merge split stacks"
description = "Before sorting, merge stackable items of the same kind that are in separate stacks."

[[settings]]
key = "hud_button"
type = "bool"
default = true
label = "Sort button on the inventory"
description = "Shows a Sort button in the inventory panel's top-right corner while sorting is possible."

[[settings]]
key = "debug"
type = "bool"
default = false
label = "Log items"
description = "Write every inventory entry to uk_qol.log before and after each sort."
