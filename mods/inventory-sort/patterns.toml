# Patterns for inventory-sort. Format: CONTRIBUTING.md, "Adding a mod".

# The party inventory (one for the whole party; heroes only have equipment):
# { int next_seq; int count; int capacity; Entry* entries; int listener_count;
#   Listener** listeners }, Entry = 0x18 bytes { Item*; int; int seq; byte new }.
# Site: `lea rcx, [inventory]; call Inventory::GetAt; mov rdi, rax; test rax, rax; je`.
# Found from the save code that writes the "inventory" list (Party::SaveState).
[party_inventory]
pattern = "48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 8B F8 48 85 C0 74"
rip = { disp = 3, len = 7 }

# The HUD's party inventory panel (an InventoryView, RTTI name in the exe):
# +0 Inventory*, +0x80 the panel's screen rect (x, y, w, h), +0x100 the
# "rebuild layout" flag that inventory changes set. Site: `lea rcx, [view];
# call InventoryView::Layout; mov eax, [..]; mov [..], eax; mov [..], r12d`.
# Not used yet (for a Sort button anchored to the panel); optional.
[inventory_view]
pattern = "48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 8B 05 ?? ?? ?? ?? 89 05 ?? ?? ?? ?? 44 89 25"
rip = { disp = 3, len = 7 }
optional = true

# The HUD panel mode (dword): 1 plain HUD, 2 gamepad pick-from-floor, 3 gamepad
# inventory cursor, 6 character sheet ("Equip panel"), 10 alchemy, 7-9/11 other
# panels (seen in game: 1, 3, 6). Site: the
# command handler's `cmp [mode], 3; jne; movzx ebx, bl; cmp [..], r12d`.
[hud_mode]
pattern = "83 3D ?? ?? ?? ?? 03 75 0E 0F B6 DB 44 39 25"
rip = { disp = 2, len = 7 }

# Pointer to the HUD's immediate-mode GUI context (always set in game; the
# engine's "current context" pointer is only set while a GUI frame is being
# built). Its +0x58 is the press/drag state (0 idle, 1 pressed, 2 dragging,
# the "__drag__" code). Site: the per-frame update's `mov rcx, [ctx]` that
# loads the argument of GuiBegin, then `mulss xmm0, [..]; mov [rbp+..], rax;
# mulss xmm1, [..]; addss xmm3, xmm0`.
[gui_ctx]
pattern = "48 8B 0D ?? ?? ?? ?? F3 0F 59 05 ?? ?? ?? ?? 48 89 85 ?? ?? ?? ?? F3 0F 59 0D ?? ?? ?? ?? F3 0F 58 D8"
rip = { disp = 3, len = 7 }

# The game state (dword; 1 startup logo, 5/6 menus, 3 is excluded by the
# HUD's own input check). Site: MainMenuEnter's `sub rsp, 0x78; xorps;
# mov dword [state], 5; mov cl, 1`.
[game_state]
pattern = "48 83 EC 78 0F 57 C0 C7 05 ?? ?? ?? ?? 05 00 00 00 B1 01"
offset = 7
rip = { disp = 2, len = 10 }

# The menu/dialog state (dword; 0 = none) the HUD checks before taking
# input. Site: the command handler's `mov eax, [state]; cmp eax, 5; je;
# cmp eax, 0xb; jne`.
[menu_state]
pattern = "8B 05 ?? ?? ?? ?? 83 F8 05 74 09 83 F8 0B 0F 85 ?? ?? ?? ?? E8 ?? ?? ?? ?? E9"
rip = { disp = 2, len = 6 }

# A HUD modal screen id (dword; 0 = none), also part of the HUD's input
# check. Site: `cmp [modal], 6; jne …; lea rcx, …`.
[hud_modal]
pattern = "83 3D ?? ?? ?? ?? 06 0F 85 ?? ?? ?? ?? 48 8D 0D ?? ?? ??"
rip = { disp = 2, len = 7 }

# bool HudInputBlocked(): true while the console is open or the window isn't
# focused (calls SDL_GetWindowFlags). Called first in every HUD input check.
[input_blocked]
pattern = "48 83 EC 28 48 8B 05 ?? ?? ?? ?? 48 85 C0 74 06 80 78 08 00 75 46 48 8B 05 ?? ?? ?? ?? 48 85 C0 74 06 80 78 08 00 75 34"

# Item* Inventory::Add(Inventory*, Item*, bool newly_picked): appends, or
# merges a stackable item into the stack with the same definition name
# (and releases the merged item). Marks the listeners changed.
[inventory_add]
pattern = "40 55 57 48 83 EC 38 48 89 5C 24 50 33 FF 48 8B EA 48 89 74 24 58 48 8B D9 4C 89 64 24 60 4C 89 6C 24 30 45 0F B6 E8"

# bool Inventory::Remove(Inventory*, Item*): removes the entry (keeps the
# order of the others), marks the listeners changed.
[inventory_remove]
pattern = "40 53 48 83 EC 20 48 63 41 08 45 33 C9 48 8B D9 85 C0 7E ?? 4C 8B 59 10 4C 8B D0 49 8B C3 45 8B C1 48 39 10 74"
