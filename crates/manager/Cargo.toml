[package]
name = "uk-qol-manager"
description = "Installer, settings and updater for Underkeep QoL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "uk-qol"
path = "src/main.rs"

[dependencies]
uk-qol-runtime.workspace = true
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit", "clipboard", "links"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
toml_edit = "0.25.19"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "json"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3.27.0"
