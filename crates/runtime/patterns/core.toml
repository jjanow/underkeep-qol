# The runtime's own patterns (save hooks and data patches), in the same
# format as a mod's patterns.toml (CONTRIBUTING.md). A file
# `uk_qol/patterns/core.toml` in the game folder replaces this one whole.
# Names and argument lists are from reverse engineering game 1.0.5; each
# pattern matches exactly once there.

# SaveGame_Write(DefTable** state, const String* file_name,
# const String* custom_name) -> bool. Serializes the save table and writes
# it through Steam Cloud (ISteamRemoteStorage::FileWrite). Every save path
# (save menu, quick save, autosave) ends here.
[savegame_write]
pattern = "48 89 5C 24 10 48 89 74 24 18 57 48 83 EC 40 4D 8B D0 48 8B F2 48 8B D9 33 FF 48 89 7C 24 20 41 39 78 10 4C 8D 05"

# Game_LoadFromSlot(const SaveInfo* info, bool silent) -> bool. SaveInfo
# +0x08 is the save's file name (String). The only path that loads a save;
# the heroes are restored when it returns.
[game_load_from_slot]
pattern = "48 89 5C 24 08 48 89 74 24 10 48 89 7C 24 18 4C 89 74 24 20 55 48 8D 6C 24 D0 48 81 EC 30 01 00 00 0F B6 DA 48 8B F9 E8 ?? ?? ?? ?? C6 05 ?? ?? ?? ?? 00 BA 01 00 00 00 48 8D 0D"

# Save_DeleteFile(const String* name). Logs "Save: Deleting file %1..." and
# deletes the Steam Cloud file. Called from the save menu.
[save_delete_file]
pattern = "48 89 5C 24 08 48 89 74 24 10 48 89 7C 24 18 4C 89 74 24 20 55 48 8D 6C 24 A9 48 81 EC F0 00 00 00 48 8B F9 4C 8D 35 ?? ?? ?? ?? 33 F6"

# Party_InitFromPartySetup(PartySetup*). Builds the party of a new game
# (reads "party_setups"); called only when a new game starts (party setup,
# party selection, quick start), never when a save or level loads.
[party_init_from_setup]
pattern = "48 89 5C 24 08 55 56 57 41 54 41 55 41 56 41 57 48 8D AC 24 90 FE FF FF 48 81 EC 70 02 00 00 4C 8B F1 8B 35"

# g_party: the Party global; 4 heroes of 0x2b8 bytes at +0x10. The lea
# that loads it right before the call to Party::SaveState.
[g_party]
pattern = "48 8D 55 70 48 8B CF E8 ?? ?? ?? ?? 48 8B D0 48 8D 0D ?? ?? ?? ?? E8"
offset = 15
rip = { disp = 3, len = 7 }

# DefTable_Parse(const char* data, int size, const String* name) -> DefTable*.
# Every DfT document the game reads goes through it (defs, text, levels,
# saves, the player profile); data starting with FF "DfT" is the binary form.
[deftable_parse]
pattern = "48 89 6C 24 18 48 89 74 24 20 57 48 83 EC 20 49 8B E8 8B F2 48 8B F9 83 FA 04 0F 8E ?? ?? ?? ?? 80 39 FF"

# ---- HUD (runtime::hud) ----

# GuiLayout: the HUD's named rects from def_def's `gui` table, loaded once at
# init (GuiLayout_Load). Site: the init's `call; call; lea rcx, [layout];
# call GuiLayout_Load; mov edx, [..]`.
[g_gui_layout]
pattern = "E8 ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 8B 15"
offset = 10
rip = { disp = 3, len = 7 }

# The game state (dword; 4 while playing). Site: MainMenuEnter's
# `sub rsp, 0x78; xorps; mov dword [state], 5; mov cl, 1`.
[g_game_state]
pattern = "48 83 EC 78 0F 57 C0 C7 05 ?? ?? ?? ?? 05 00 00 00 B1 01"
offset = 7
rip = { disp = 2, len = 10 }

# The HUD panel mode (dword; 0 = no HUD: the HUD function returns at once).
# Site: the command handler's `cmp [mode], 3; jne; movzx ebx, bl; cmp [..], r12d`.
[g_hud_mode]
pattern = "83 3D ?? ?? ?? ?? 03 75 0E 0F B6 DB 44 39 25"
rip = { disp = 2, len = 7 }

# The menu / dialog state over the HUD (dword; 0 = none). Site: the command
# handler's `mov eax, [state]; cmp eax, 5; je; cmp eax, 0xb; jne`.
[g_menu_state]
pattern = "8B 05 ?? ?? ?? ?? 83 F8 05 74 09 83 F8 0B 0F 85 ?? ?? ?? ?? E8 ?? ?? ?? ?? E9"
rip = { disp = 2, len = 6 }

# The HUD interaction mode (dword; 0 = none, 1 target selection, 5 shop,
# other panels). Site: `cmp [mode], 6; jne …; lea rcx, …`.
[g_interaction_mode]
pattern = "83 3D ?? ?? ?? ?? 06 0F 85 ?? ?? ?? ?? 48 8D 0D ?? ?? ??"
rip = { disp = 2, len = 7 }

# ---- Overlay (runtime::overlay) ----

# UiContext_DrawLayers(UiContext*): submits the game UI's three layers to
# the render device: panels (+0x638), popups (+0x6d8), and the top layer
# (+0x778: the item being dragged), the last as a tail jump to the device's
# list submission. Called while the frame is drawn offscreen, before it's
# copied to the window and the game draws its software cursor
# (`cursor1`..`cursor3`). The overlay draws the mods' HUD widgets right
# before the top layer, so the carried item and the cursor stay on top
# (runtime::overlay::layer reads the top layer's offset and the submit
# target from this code).
[ui_layers_draw]
pattern = "40 53 48 83 EC 20 80 B9 ?? ?? ?? ?? 00 48 8B D9 74 ?? 48 8B 81 ?? ?? ?? ?? C6 00 00 48 8B 81 ?? ?? ?? ?? C6 00 00 48 8B 81 ?? ?? ?? ?? C6 00 00 C6 81 ?? ?? ?? ?? 00 48 8B 91 ?? ?? ?? ?? 48 8B 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 8B 93 ?? ?? ?? ?? 48 8B 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 8B 93 ?? ?? ?? ?? 48 8B 0D ?? ?? ?? ?? 48 83 C4 20 5B E9"

# The game's `cursor` setting (0..2: sprites cursor1..cursor3, 3: the
# system cursor): a cvar index and the cvar table (0x80 bytes per cvar,
# the value at +0x70). From the cursor pass, which picks the sprite:
# `movsxd rax, [cursor1 id]; movsxd rdx, [cvar]; shl rdx, 7; ...;
# mov rcx, [cvars]; mov r8d, [rdx+rcx+0x70]`. Only used when
# ui_layers_draw is missing, to redraw the right cursor over HUD widgets.
[g_cursor_cvar]
pattern = "48 63 05 ?? ?? ?? ?? 48 63 15 ?? ?? ?? ?? 48 C1 E2 07 48 89 9C 24 ?? ?? ?? ?? 48 8D 0C 80 49 8B 1C CF 48 8B 0D ?? ?? ?? ?? 44 8B 44 0A 70 45 85 C0"
offset = 7
rip = { disp = 3, len = 7 }

[g_cvars]
pattern = "48 63 05 ?? ?? ?? ?? 48 63 15 ?? ?? ?? ?? 48 C1 E2 07 48 89 9C 24 ?? ?? ?? ?? 48 8D 0C 80 49 8B 1C CF 48 8B 0D ?? ?? ?? ?? 44 8B 44 0A 70 45 85 C0"
offset = 34
rip = { disp = 3, len = 7 }
