[package]
name = "uk-qol-runtime"
description = "Underkeep QoL mod runtime: runs inside the game process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "uk_qol_runtime"

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.37", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.2.1"
