[workspace]
resolver = "3"
members = [
    "crates/proxy",
    "crates/runtime",
    "crates/dft",
    "crates/manager",
    "mods/bloodmage-cost",
    "mods/skip-logos",
    "mods/weapon-swap",
    "mods/inventory-sort",
    "mods/extra-skill-slots",
    "mods/borderless-compat",
    "mods/item-highlight",
    "mods/melee-accuracy",
    "mods/learned-recipes",
    "mods/shop-sort",
    "mods/party-numbers",
    "mods/enemy-health",
    "mods/hidden-stats",
    "mods/item-cooldowns",
]

[workspace.package]
version = "1.0.17"
edition = "2024"
license = "MIT"
repository = "https://github.com/jjanow/underkeep-qol"

[workspace.dependencies]
uk-qol-runtime = { path = "crates/runtime" }
uk-qol-dft = { path = "crates/dft" }
uk-qol-mod-bloodmage-cost = { path = "mods/bloodmage-cost" }
uk-qol-mod-skip-logos = { path = "mods/skip-logos" }
uk-qol-mod-weapon-swap = { path = "mods/weapon-swap" }
uk-qol-mod-inventory-sort = { path = "mods/inventory-sort" }
uk-qol-mod-extra-skill-slots = { path = "mods/extra-skill-slots" }
uk-qol-mod-borderless-compat = { path = "mods/borderless-compat" }
uk-qol-mod-item-highlight = { path = "mods/item-highlight" }
uk-qol-mod-melee-accuracy = { path = "mods/melee-accuracy" }
uk-qol-mod-learned-recipes = { path = "mods/learned-recipes" }
uk-qol-mod-shop-sort = { path = "mods/shop-sort" }
uk-qol-mod-party-numbers = { path = "mods/party-numbers" }
uk-qol-mod-enemy-health = { path = "mods/enemy-health" }
uk-qol-mod-hidden-stats = { path = "mods/hidden-stats" }
uk-qol-mod-item-cooldowns = { path = "mods/item-cooldowns" }

# Same as Underkeeper except `panic`: the runtime catches panics around every
# hook (a failing mod is disabled, the game keeps running), which needs
# unwinding. Cargo can't set `panic` per package, so it's unwind everywhere.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
